version: "1.0"

# Qodana CLI 2025.3+ rejects `--linter` for any value (short name or
# image path) and requires `--image` for the Docker image. The action
# forwards qodana.yaml's `image:` field directly to `--image`, so
# pinning the Rust linter image here is the only configuration the
# CLI accepts.
#
# ⚠ EAP images expire. `jetbrains/qodana-rust` is still Early Access —
# every EAP image carries a built-in evaluation license with a fixed
# expiry date. When it lapses, scans fail with "qodana scan failed with
# exit code 1" (and the SARIF upload step then fails with "Path does
# not exist"). JetBrains publishes the successor image shortly before
# the old one expires, so the fix is always: bump this tag to the
# newest `-eap` on hub.docker.com/r/jetbrains/qodana-rust/tags.
# Do NOT switch to `latest` — JetBrains does not reliably re-point it
# (as of 2026-07 `latest` still equals the expired 2026.1-eap digest).
# History: 2026.1-eap expired ~2026-07-05 → bumped to 2026.2-eap.
# Revisit and pin properly once a stable (non-EAP) tag ships.
image: jetbrains/qodana-rust:2026.2-eap

profile:
  name: qodana.recommended

# Permissive on first-run findings so the workflow stays advisory and
# doesn't break the build while we triage the initial inspection set.
failureConditions:
  severityThresholds:
    any: 1000
