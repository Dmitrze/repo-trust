# rustfmt configuration
# We use the stable defaults plus a few opinionated tweaks.
# Run with: cargo fmt --all

edition = "2021"
max_width = 100
use_small_heuristics = "Default"
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
fn_params_layout = "Tall"
match_block_trailing_comma = true
remove_nested_parens = true
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# Note: some options above are nightly-only. CI runs `cargo fmt --check`
# under stable; non-stable options will be silently ignored on stable
# builds and only enforce when contributors use nightly fmt.
