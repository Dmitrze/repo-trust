[package]
name = "repo-trust"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Repo Trust contributors"]
description = "A command-line tool that tells you whether an open-source repository deserves your trust — beyond the star count."
readme = "README.md"
repository = "https://github.com/Dmitrze/repo-trust"
homepage = "https://github.com/Dmitrze/repo-trust"
documentation = "https://docs.rs/repo-trust"
license = "Apache-2.0"
keywords = ["github", "security", "supply-chain", "oss", "diligence"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".github/",
    ".repo-trust/",
    "benches/fixtures/",
    "docs/adr/",
    "examples/benchmark-set.csv",
    "tests/fixtures/",
]

[lib]
name = "repo_trust"
path = "src/lib.rs"

[[bin]]
name = "repo-trust"
path = "src/main.rs"

# ─── Runtime dependencies ──────────────────────────────────────────────
[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
indicatif = "0.17"
console = "0.15"
comfy-table = "7.1"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "http2"] }
url = "2.5"

# GitHub API
octocrab = "0.39"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.9"
schemars = "0.8"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rusqlite_migration = "1.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# Config
figment = { version = "0.10", features = ["toml", "env"] }
dirs = "5.0"

# Web (optional, behind feature flag)
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["fs", "trace"], optional = true }
askama = { version = "0.12", optional = true }
rust-embed = { version = "8.5", optional = true }

# Graph analysis (deep mode)
petgraph = { version = "0.6", optional = true }

# Random (deterministic)
rand = "0.8"
rand_chacha = "0.3"

# Hashing
blake3 = "1.5"

# Semver for scoring versions
semver = { version = "1.0", features = ["serde"] }

# ─── Dev dependencies ──────────────────────────────────────────────────
[dev-dependencies]
insta = { version = "1.40", features = ["json", "yaml"] }
proptest = "1.5"
wiremock = "0.6"
tempfile = "3.12"
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.5", features = ["async_tokio"] }
# `figment` Jail used for hermetic env+file-scoped config tests; gated
# behind the "test" feature in figment itself.
figment = { version = "0.10", features = ["toml", "env", "test"] }

# ─── Features ──────────────────────────────────────────────────────────
[features]
default = ["web", "deep"]
web = ["dep:axum", "dep:tower-http", "dep:askama", "dep:rust-embed"]
deep = ["dep:petgraph"]
benchmark = []

# ─── Build profiles ────────────────────────────────────────────────────
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
# Faster incremental builds; debug info kept
opt-level = 0
debug = true

# Speed up dev iteration on tests
[profile.test]
opt-level = 1

# ─── Benchmark configuration ───────────────────────────────────────────
[[bench]]
name = "scoring_bench"
harness = false

# ─── Documentation ─────────────────────────────────────────────────────
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
