# Dependabot — re-enabled for v0.1.0 per chore/ci-strict-gates (Day 5).
# Phase 1 modules + tests can now validate dependency bumps.

version: 2
updates:
  # Rust crates.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      tokio:
        patterns:
          - "tokio*"
      tracing:
        patterns:
          - "tracing*"
      serde:
        patterns:
          - "serde*"

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
