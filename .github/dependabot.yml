version: 2
updates:
  # Rust crates
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      tokio-stack:
        patterns:
          - "tokio*"
          - "async-trait"
          - "futures*"
      serde-stack:
        patterns:
          - "serde*"
          - "schemars"
      tracing-stack:
        patterns:
          - "tracing*"
      cli-stack:
        patterns:
          - "clap*"
          - "console"
          - "indicatif"
          - "comfy-table"
      web-stack:
        patterns:
          - "axum"
          - "tower-http"
          - "askama"
          - "rust-embed"
      dev-tools:
        dependency-type: development

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
