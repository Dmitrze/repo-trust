# Dependabot is intentionally DISABLED during the pre-alpha (Phase 0/1).
#
# Why: on day one Dependabot opened 15 PRs because it found newer versions
# of every crate pinned in Cargo.toml. That is correct behaviour, but it
# is the wrong stage of the project \u2014 we don't yet have a working test
# suite that can validate that those bumps don't break anything.
#
# Plan: re-enable Dependabot once Phase 1 ships (real scan, real test
# fixtures, snapshot tests). At that point bumps are useful because the
# tests catch real regressions.
#
# To re-enable: replace this file with the content from the previous
# revision in git history (commit ab0ee38).

version: 2
updates: []
