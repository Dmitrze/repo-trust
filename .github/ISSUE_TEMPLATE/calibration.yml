name: Calibration feedback
description: A repo's Trust Report doesn't match what you'd expect from real-world reputation
labels: [calibration, triage]
body:
  - type: markdown
    attributes:
      value: |
        Calibration feedback helps us tune scoring against ground truth. File this when a repo's Trust Score and Category clearly disagree with how the ecosystem actually treats the repo — well-trusted projects scored low, or risky-looking projects scored high.

        Repo Trust is a trust-scoring tool, not a security audit. A `HighRisk` category is a probabilistic signal based on named features and named thresholds — never an allegation of misconduct. If you believe a label has misrepresented your project, this template is the right place.

  - type: input
    id: repo
    attributes:
      label: Repository scored
      description: "owner/repo or full URL"
      placeholder: "octocat/Hello-World"
    validations:
      required: true

  - type: input
    id: received_score
    attributes:
      label: Score received
      description: "Trust Score and Category from the report"
      placeholder: "Score: 42 | Category: HighRisk"
    validations:
      required: true

  - type: input
    id: expected_score
    attributes:
      label: Score you'd expect
      description: "Your judgement of where this repo should land"
      placeholder: "Score: 75 | Category: Trusted"
    validations:
      required: true

  - type: textarea
    id: ground_truth
    attributes:
      label: Why you'd expect that
      description: Concrete external signals — adoption inside large orgs, downstream package counts, conference talks, security audits passed, etc. Avoid "I just feel like it's good".
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Which module is most miscalibrated?
      options:
        - Star Authenticity
        - Activity Health
        - Maintainer Health
        - Adoption Signals
        - Security & Readiness
        - Overall aggregation (modules look right individually, weights look wrong)
        - Confidence calculation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Full JSON report
      description: Attach the full JSON output of `repo-trust scan ... --format json` (redact any tokens).
      render: json
    validations:
      required: true

  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the repo
      description: Doesn't change weight — context only.
      options:
        - I maintain or contribute to it
        - I depend on it
        - I'm doing diligence on it
        - No relationship — outside observer
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
