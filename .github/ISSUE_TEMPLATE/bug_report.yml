name: 🐛 Bug report
description: Something is broken or behaves unexpectedly
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. The more concrete you can be, the faster we can fix it.
        For security vulnerabilities, please use [Security Advisories](https://github.com/Dmitrze/repo-trust/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I run `repo-trust scan owner/repo`, ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact commands and a repo URL we can reproduce against.
      placeholder: |
        1. `repo-trust scan octocat/Hello-World --mode quick`
        2. ...
      render: bash
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full terminal output (or attach the JSON report). Redact tokens.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Repo Trust version
      description: Output of `repo-trust --version`
      placeholder: "repo-trust 0.1.0"
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: Output of `rustc --version` (only relevant if you built from source)
      placeholder: "rustc 1.78.0"

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help.
