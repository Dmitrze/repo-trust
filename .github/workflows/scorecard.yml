name: OpenSSF Scorecard

# Self-application of OpenSSF Scorecard. Runs weekly to dogfood the
# methodology repo-trust federates from. Results upload to GitHub's
# code-scanning UI and to securityscorecards.dev.

on:
  branch_protection_rule:
  schedule:
    # Wednesday 04:17 UTC — off-peak.
    - cron: '17 4 * * 3'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
