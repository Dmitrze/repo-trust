name: OpenSSF Scorecard

# Self-application of OpenSSF Scorecard. Runs weekly to dogfood the
# methodology repo-trust federates from. Results upload to GitHub's
# code-scanning UI and to securityscorecards.dev.

on:
  branch_protection_rule:
  schedule:
    # Wednesday 04:17 UTC — off-peak.
    - cron: '17 4 * * 3'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46  # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # SCORECARD_TOKEN is a fine-grained PAT scoped only to this
          # repository (Administration: read, Contents: read,
          # Metadata: read). The default GITHUB_TOKEN cannot satisfy
          # the Branch-Protection check ("Resource not accessible by
          # integration") because branch-protection metadata sits
          # behind admin-scope GraphQL queries that are not exposed
          # to the workflow's installation token.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@0daab03d71ff584ef619d027a3fd9146679c5d84  # v3
        with:
          sarif_file: results.sarif
