name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

# Default to least-privilege at the top level; jobs that need write
# access narrow on their own. Required for full credit on OpenSSF
# Scorecard's Token-Permissions check.
permissions: read-all

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # softprops/action-gh-release creates the draft
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: true

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write       # uploads built archives to the release
      id-token: write       # OIDC for SLSA provenance signing
      attestations: write   # SLSA provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            ext: .exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} --all-features
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --all-features
      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../repo-trust-${{ matrix.target }}.tar.gz repo-trust
          cd ../../..
          shasum -a 256 repo-trust-${{ matrix.target }}.tar.gz > repo-trust-${{ matrix.target }}.tar.gz.sha256
      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../repo-trust-${{ matrix.target }}.zip repo-trust.exe
          cd ../../..
          (Get-FileHash repo-trust-${{ matrix.target }}.zip -Algorithm SHA256).Hash | Out-File repo-trust-${{ matrix.target }}.zip.sha256
      - name: Generate provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v1
        with:
          subject-path: |
            repo-trust-${{ matrix.target }}.tar.gz
            repo-trust-${{ matrix.target }}.zip
        continue-on-error: true
      - name: Install Cosign
        # Sigstore keyless signing via OIDC. Pairs with attest-build-
        # provenance above: SLSA provenance proves *how* it was built;
        # cosign signs prove *who* (which workflow identity) cut the
        # release. See docs/RELEASE_VERIFICATION.md.
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
      - name: Sign archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature repo-trust-${{ matrix.target }}.tar.gz.sig \
            --output-certificate repo-trust-${{ matrix.target }}.tar.gz.pem \
            repo-trust-${{ matrix.target }}.tar.gz
      - name: Sign archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes `
            --output-signature repo-trust-${{ matrix.target }}.zip.sig `
            --output-certificate repo-trust-${{ matrix.target }}.zip.pem `
            repo-trust-${{ matrix.target }}.zip
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ needs.create-release.outputs.release_id != '' && github.ref_name || github.event.inputs.tag }}
          files: |
            repo-trust-${{ matrix.target }}.tar.gz
            repo-trust-${{ matrix.target }}.tar.gz.sha256
            repo-trust-${{ matrix.target }}.tar.gz.sig
            repo-trust-${{ matrix.target }}.tar.gz.pem
            repo-trust-${{ matrix.target }}.zip
            repo-trust-${{ matrix.target }}.zip.sha256
            repo-trust-${{ matrix.target }}.zip.sig
            repo-trust-${{ matrix.target }}.zip.pem
          fail_on_unmatched_files: false

  publish-crate:
    name: Publish to crates.io
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      id-token: write       # OIDC for crates.io trusted publisher
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --all-features --no-verify

  publish-docker:
    name: Publish container image
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dmitrze/repo-trust:latest
            ghcr.io/dmitrze/repo-trust:${{ github.ref_name }}
          provenance: true
          sbom: true
