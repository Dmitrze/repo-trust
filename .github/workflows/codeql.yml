name: CodeQL

# Disabled on every push during pre-alpha. CodeQL on a skeleton crate
# produces no useful signal. Run manually via the Actions tab when
# we want a SAST snapshot.
#
# Re-enable scheduled runs once Phase 1 ships and there is real code
# to analyse.

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
