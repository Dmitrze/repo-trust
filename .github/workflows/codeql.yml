name: CodeQL

# DISABLED — CodeQL does not natively support Rust. CodeQL's supported
# languages are JavaScript/TypeScript, Python, Java/Kotlin, C/C++, C#,
# Go, Ruby, and Swift. Running it on a Rust repository fails on every
# push because the autobuild step cannot analyse the source.
#
# Static analysis for Rust in this repo is covered by:
#   - clippy (--all-targets --all-features -- -D warnings -W clippy::pedantic)
#   - cargo-audit (RUSTSEC advisories)
#   - cargo-deny (licenses, advisories, bans, sources)
# all wired into .github/workflows/ci.yml.
#
# We keep this file as a workflow_dispatch-only stub so the workflow
# entry stays in the repo's history — if GitHub adds Rust support later
# the trigger can be re-enabled by restoring the original `on:` block.

on:
  workflow_dispatch:

permissions: read-all

jobs:
  noop:
    name: Disabled (Rust unsupported by CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain why this workflow is a no-op
        run: |
          echo "CodeQL does not support Rust."
          echo "See ci.yml for clippy, cargo-audit, and cargo-deny."
