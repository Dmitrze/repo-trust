name: CI

# Pre-alpha CI: lite gates only.
#
# We deliberately do NOT enforce -D warnings, pedantic clippy, coverage,
# cargo-deny, or cargo-audit at this stage. The crate is a typed skeleton
# whose modules return Err("not yet implemented"); strict lint gates
# produce noise, not signal.
#
# Re-enable strict gates progressively as Phase 1 modules land:
#   - Phase 1: enable -D warnings + pedantic clippy on real code.
#   - Phase 2: enable coverage gate (>=70% overall).
#   - Phase 2: enable cargo-deny and cargo-audit.
#   - v1.0:    enable rustdoc -D warnings.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-features
      - name: cargo build
        run: cargo build --all-features
      - name: cargo test
        run: cargo test --all-features
