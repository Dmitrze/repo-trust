name: Qodana

# JetBrains Qodana for Rust — primary static analysis tool. SARIF uploads
# to GitHub code-scanning.
#
# ⏸ PAUSED (2026-07-16): automatic triggers (push + weekly schedule) are
# disabled because the Qodana Cloud organization's 60-day trial license
# expired on ~2026-07-05. Every run since then fails at startup with
# "License request: token was declined by Qodana Cloud server" — the
# QODANA_TOKEN itself is fine, the org just has no active license for the
# Ultimate-tier qodana-rust linter.
#
# The workflow file intentionally stays in the repo:
#   - OpenSSF Scorecard's SAST check detects JetBrains/qodana-action
#     statically from this file, independent of run outcomes.
#   - Semgrep (.github/workflows/semgrep.yml) continues running weekly
#     as the project's active SAST signal in the meantime.
#
# TO RE-ENABLE once a license is active again (free JetBrains OSS license
# application: https://www.jetbrains.com/shop/eform/opensource — link the
# granted license to the Qodana Cloud org, then):
#   1. Restore the triggers below to:
#        on:
#          workflow_dispatch:
#          push:
#            branches: [main]
#          schedule:
#            - cron: '0 6 * * 1'
#   2. Run once manually to confirm green:
#        gh workflow run qodana.yml -R Dmitrze/repo-trust
#
# Why Qodana (not CodeQL or static Semgrep):
#   - CodeQL doesn't support Rust.
#   - OpenSSF Scorecard's SAST detector statically recognises Qodana
#     (alongside CodeQL, Sonar, Snyk, Pysa) but does NOT statically
#     recognise Semgrep — Semgrep is only credited via PR check-suites,
#     which a solo direct-push workflow does not produce.

on:
  workflow_dispatch:

permissions: read-all

jobs:
  qodana:
    name: Qodana for Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana Scan
        uses: JetBrains/qodana-action@89eb4357efd2b52e639f3216e63edaf33b82622b  # v2025.3
        with:
          # The Rust linter is selected by qodana.yaml. The action's
          # `args:` is left empty: passing `--linter` with a Docker
          # image path was rejected by the 2025.3 CLI ("Unrecognized
          # '--linter' value … please use '--image' instead"). Letting
          # qodana.yaml drive the configuration keeps a single source
          # of truth.
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@0daab03d71ff584ef619d027a3fd9146679c5d84  # v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana
