name: Semgrep SAST

# Static Application Security Testing via Semgrep. Runs the Rust ruleset
# (p/rust) plus the curated security-audit pack (p/security-audit) and
# uploads SARIF to GitHub code scanning. Warning-only — does NOT fail
# the build (no --error) so that a solo maintainer is not blocked by
# noisy advisory matches; severities are triaged in the code-scanning UI.
#
# Why this isn't using semgrep/semgrep-action:
#   - The action repo (renamed from returntocorp/semgrep-action) was
#     archived in 2023 and still wraps the obsolete returntocorp/
#     semgrep-agent:v1 image. The maintained surface today is the
#     semgrep/semgrep Docker image, refreshed per release.
#   - Running the maintained image directly as a job container avoids
#     pulling in archived action machinery and gives us a SHA-pinned
#     dependency that Scorecard's Pinned-Dependencies check counts
#     toward the score.
#
# Scorecard SAST coverage caveat:
#   - Scorecard's static workflow detector for SAST recognises CodeQL,
#     Sonar, Snyk, Pysa, and Qodana — not Semgrep statically. Semgrep
#     is only credited via PR check-suite runs. A solo maintainer who
#     pushes direct to main therefore won't move this check off 0
#     until the project starts merging PRs that produce a Semgrep
#     check run. The workflow still serves its primary purpose of
#     uploading findings to GitHub code scanning for triage.

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  schedule:
    # Monday 06:00 UTC — weekly cadence, off-peak.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  semgrep:
    name: Semgrep (p/rust + p/security-audit)
    runs-on: ubuntu-latest
    # SHA-pinned to semgrep/semgrep:1.161.0. The image bundles a
    # pinned Semgrep CLI release plus its rule loader. Refresh by
    # querying Docker Hub for the latest stable manifest digest.
    container:
      image: semgrep/semgrep@sha256:326e5f41cc972bb423b764a14febbb62bbad29ee1c01820805d077dd868fea48
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Run Semgrep
        # No --error: warning-only while the team is solo. Findings
        # land in the code-scanning UI for triage instead of blocking
        # PRs.
        run: |
          semgrep \
            --config=p/rust \
            --config=p/security-audit \
            --sarif --output=semgrep.sarif \
            --metrics=off

      - name: Upload SARIF to code scanning
        # Same SHA as scorecard.yml — keeps the codeql-action pin in sync.
        uses: github/codeql-action/upload-sarif@0daab03d71ff584ef619d027a3fd9146679c5d84  # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        if: always()
