# cargo-deny configuration
# Run with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─── Advisory database ────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `number_prefix` is pulled in transitively by `indicatif` (progress
    # bars). RUSTSEC-2025-0119 marks it as unmaintained — there is no
    # exploitability claim, only a maintenance flag, and no safe upgrade
    # is available. Track upstream `indicatif` for migration to the
    # recommended `unit-prefix` replacement; review by 2026-11-01.
    { id = "RUSTSEC-2025-0119", reason = "transitive via indicatif; unmaintained-only, no fix available; review 2026-11-01" },
]

# ─── License policy ───────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.95
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    # CDLA-Permissive-2.0 is a Linux Foundation permissive data license
    # — used by `webpki-roots` (Mozilla CA bundle redistributed for
    # rustls). Compatible with our Apache-2.0 distribution; we are not
    # modifying the bundle.
    "CDLA-Permissive-2.0",
]
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ─── Banned crates ────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# We ban OpenSSL in favor of rustls — security and portability.
deny = [
    { name = "openssl", reason = "Use rustls instead of OpenSSL" },
    { name = "openssl-sys", reason = "Use rustls instead of OpenSSL" },
    { name = "native-tls", reason = "Use rustls instead of native-tls" },
]
skip = []
skip-tree = []

# ─── Source allowlist ─────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
