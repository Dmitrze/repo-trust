<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repo Trust — GitHub trust scoring beyond stars">
  <title>Repo Trust — GitHub trust scoring beyond stars</title>
  <desc>Banner for the Repo Trust open-source CLI tool. Pure black background with white sans-serif title, lavender italic serif accent, italic serif subtitle, and green status indicator.</desc>

  <!-- Pure black background -->
  <rect width="1200" height="360" fill="#000000"/>

  <!-- Shield with checkmark icon, top center, white outline on black -->
  <g transform="translate(584, 36)" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M16 0 L32 6 L32 26 Q32 38 16 46 Q0 38 0 26 L0 6 Z" stroke-width="1.6"/>
    <path d="M9 22 L14 27 L24 16" stroke-width="2.2"/>
  </g>

  <!-- Brand label small caps gray, like "DMITRY MELNIK" on his site -->
  <text x="600" y="108" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="4">REPO TRUST</text>

  <!-- Big sans bold white, like "Fractional" -->
  <text x="600" y="188" text-anchor="middle"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-2">GitHub trust scoring,</text>

  <!-- Big italic serif lavender accent, like "Chief AI Officer" -->
  <text x="600" y="244" text-anchor="middle"
        font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-size="50" font-style="italic" font-weight="500" fill="#c4b5fd" letter-spacing="-1">beyond stars.</text>

  <!-- Italic serif gray subtitle, like his "I walk in, audit..." -->
  <text x="600" y="288" text-anchor="middle"
        font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-size="15" font-style="italic" fill="#9ca3af">Find out which repos are actually maintained, secure, and worth depending on.</text>

  <!-- Status row centered, green dot + small caps gray, like "TAKING 2-3 PROJECTS A MONTH" -->
  <g transform="translate(517, 320)">
    <circle cx="4" cy="-3" r="3.5" fill="#4ade80"/>
    <text x="16" y="0"
          font-family="ui-sans-serif, -apple-system, system-ui, sans-serif"
          font-size="10.5" font-weight="600" fill="#9ca3af" letter-spacing="3.5">ACCEPTING SPONSORS</text>
  </g>
</svg>
