<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" role="img" aria-label="Example output: repo-trust scan rust-lang/cargo showing 5-module trust report">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="1192" height="632" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="4" y="4" width="1192" height="44" rx="12" fill="#f8fafc"/>
  <rect x="4" y="36" width="1192" height="12" fill="#f8fafc"/>
  <line x1="4" y1="48" x2="1196" y2="48" stroke="#e2e8f0" stroke-width="1"/>

  <text x="32" y="30" fill="#0ea5e9" font-weight="700">$</text>
  <text x="50" y="30" fill="#0f172a">repo-trust scan rust-lang/cargo</text>

  <g transform="translate(32, 84)">

