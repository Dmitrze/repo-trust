    <line x1="0" y1="272" x2="1100" y2="272" stroke="#e2e8f0" stroke-width="1"/>

    <text y="302" fill="#dc2626" font-weight="700">Top concerns:</text>

    <text y="330" fill="#0f172a">  • commits_last_90d</text>
    <text x="320" y="330" fill="#94a3b8">Activity</text>
    <text x="500" y="330" fill="#dc2626" font-weight="600">HighRisk</text>

    <text y="358" fill="#0f172a">  • median_issue_response</text>
    <text x="320" y="358" fill="#94a3b8">Activity</text>
