    <text y="484" fill="#0f172a">  • commit_concentration</text>
    <text x="320" y="484" fill="#94a3b8">Maintainers</text>
    <text x="500" y="484" fill="#059669" font-weight="600">Positive</text>

    <text y="512" fill="#0f172a">  • scorecard_score</text>
    <text x="320" y="512" fill="#94a3b8">Security</text>
    <text x="500" y="512" fill="#059669" font-weight="600">Positive</text>

    <text y="548" fill="#94a3b8" font-style="italic" font-size="13">Report saved to ./repo-trust-reports/rust-lang_cargo.json</text>

